services:
  - type: web
    name: krishi-mitra
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m backend.web_server
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: BIND_HOST
        value: 0.0.0.0
      - key: REQUIRE_DEMO_PASSWORD
        value: "true"
      - key: DEMO_COOKIE_SECURE
        value: "true"
      - key: DEMO_ACCESS_PASSWORD
        sync: false
      - key: DEMO_SESSION_SECRET
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: SARVAM_API_KEY
        sync: false
